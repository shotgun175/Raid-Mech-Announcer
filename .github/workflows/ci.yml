name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Windows-only: the app targets Windows and Tauri's build script links against
    # the Windows WebView2 toolchain, so Linux runners would need extra system deps.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      # npm ci validates the dependency tree but NOT the root version field —
      # releases v0.2.5–v0.2.10 all built with the lockfile stuck at 0.2.4 and
      # nothing surfaced it. Fail loudly when any version surface disagrees.
      - name: Version coherence (manifests + lockfiles agree)
        run: node .github/scripts/check-versions.mjs

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Prettier check
        run: npm run lint

      - name: Frontend tests (vitest)
        run: npm test

      # The cargo steps below compile the Tauri shell, whose build script reads
      # `frontendDist` (../build). Build the frontend first so it exists.
      - name: Build frontend
        run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-06
        with:
          components: clippy, rustfmt

      - name: Cache Rust target
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Rust formatting (cargo fmt)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust lint (cargo clippy)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust tests (cargo test)
        working-directory: src-tauri
        run: cargo test
