name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Windows-only: the app targets Windows and Tauri's build script links against
    # the Windows WebView2 toolchain, so Linux runners would need extra system deps.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      # npm ci validates the dependency tree but NOT the root version field —
      # releases v0.2.5–v0.2.10 all built with the lockfile stuck at 0.2.4 and
      # nothing surfaced it. Fail loudly when any version surface disagrees.
      - name: Version coherence (manifests + lockfiles agree)
        run: node .github/scripts/check-versions.mjs

      # `tauri build` refuses to run when the tauri crate and @tauri-apps/api (or a
      # tauri-plugin-X crate and @tauri-apps/plugin-X) differ in major.minor, but
      # only release.yml runs it. Catch a one-sided bump here instead.
      - name: Tauri pairs (crate and npm package agree)
        run: node .github/scripts/check-tauri-pairs.mjs

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Prettier check
        run: npm run lint

      - name: Frontend tests (vitest)
        run: npm test

      # The cargo steps below compile the Tauri shell, whose build script reads
      # `frontendDist` (../build). Build the frontend first so it exists.
      - name: Build frontend
        run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1 (master 2026-10-09)
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust target
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri -> target"
          save-if: ${{ github.event_name == 'push' }}

      - name: Rust formatting (cargo fmt)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust lint (cargo clippy)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust tests (cargo test)
        working-directory: src-tauri
        run: cargo test
