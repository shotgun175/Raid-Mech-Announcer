name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      notes:
        description: "Release notes (markdown bullets, optional). If filled, overrides the Unreleased section in changelog.md for this release."
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CURRENT=$(grep '"version"' package.json | head -1 | sed -E 's/.*"version": "([0-9.]+)".*/\1/')
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            case "${{ github.event.inputs.bump }}" in
              patch) PATCH=$((PATCH+1)) ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            esac
            NEW="$MAJOR.$MINOR.$PATCH"
            echo "Bumping $CURRENT -> $NEW"
            echo "new_version=$NEW" >> "$GITHUB_OUTPUT"
            echo "new_tag=v$NEW" >> "$GITHUB_OUTPUT"
            echo "should_bump=true" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            # Tag-push is verify-only: the human must have bumped all three
            # manifests first, or the published binaries would embed a version
            # that disagrees with the tag/release/latest.json and confuse the
            # updater. Fail loudly on any mismatch.
            WANT="${TAG#v}"
            PKG=$(grep '"version"' package.json | head -1 | sed -E 's/.*"version": "([0-9.]+)".*/\1/')
            CONF=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed -E 's/.*"version": "([0-9.]+)".*/\1/')
            CARGO=$(grep -E '^version = ' src-tauri/Cargo.toml | head -1 | sed -E 's/version = "([0-9.]+)"/\1/')
            if [ "$PKG" != "$WANT" ] || [ "$CONF" != "$WANT" ] || [ "$CARGO" != "$WANT" ]; then
              echo "::error::Tag $TAG does not match the manifests (package.json=$PKG, tauri.conf.json=$CONF, Cargo.toml=$CARGO). Bump them first or use workflow_dispatch."
              exit 1
            fi
            echo "new_version=$WANT" >> "$GITHUB_OUTPUT"
            echo "new_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version + stamp changelog, commit, tag, push
        if: steps.version.outputs.should_bump == 'true'
        shell: bash
        env:
          NEW: ${{ steps.version.outputs.new_version }}
          TAG: ${{ steps.version.outputs.new_tag }}
          NOTES_INPUT: ${{ github.event.inputs.notes }}
          TZ: America/New_York
        run: |
          # If the workflow_dispatch "notes" input is non-empty, replace the
          # Unreleased section's body with those notes. Lets you ship a release
          # without editing changelog.md by hand.
          if [ -n "$NOTES_INPUT" ]; then
            U_START=$(grep -n "<!-- @release Unreleased -->" src/lib/data/changelog.md | head -1 | cut -d: -f1)
            U_END=$(awk -v start="$U_START" 'NR>start && /<!-- @release-end -->/ { print NR; exit }' src/lib/data/changelog.md)
            if [ -n "$U_START" ] && [ -n "$U_END" ]; then
              TMP=$(mktemp)
              if [ "$U_START" -gt 1 ]; then
                sed -n "1,$((U_START - 1))p" src/lib/data/changelog.md > "$TMP"
              else
                : > "$TMP"
              fi
              cat >> "$TMP" <<'HEADER'
          <!-- @release Unreleased -->
          <div class="rounded-md flex space-x-2 items-center">
            <div class="text-lg font-semibold text-white">
              Unreleased
            </div>
            <div class="bg-accent-500 px-2 font-medium rounded-md text-white">
              New
            </div>
          </div>

          HEADER
              printf '%s\n\n' "$NOTES_INPUT" >> "$TMP"
              echo '<!-- @release-end -->' >> "$TMP"
              sed -n "$((U_END + 1)),\$p" src/lib/data/changelog.md >> "$TMP"
              mv "$TMP" src/lib/data/changelog.md
            fi
          fi

          # package.json AND package-lock.json in one atomic step (the lockfile
          # previously never got bumped and re-drifted every release)
          npm version "$NEW" --no-git-tag-version --allow-same-version
          # tauri.conf.json — first "version" key only, so a future
          # version-shaped plugin option can never be clobbered
          sed -i '0,/"version": "[0-9.]*"/{s/"version": "[0-9.]*"/"version": "'"$NEW"'"/}' src-tauri/tauri.conf.json
          # Cargo.toml — first "version" line under [package]
          sed -i '0,/^version = "[0-9.]*"/{s/^version = "[0-9.]*"/version = "'"$NEW"'"/}' src-tauri/Cargo.toml
          # changelog.md — rename "@release Unreleased" marker to the new version
          sed -i "s|<!-- @release Unreleased -->|<!-- @release $TAG -->|" src/lib/data/changelog.md

          # Compute date with ordinal suffix in Eastern time, long-form (e.g. "May 7th, 2026").
          # Uses Node's Intl.DateTimeFormat instead of GNU `date` because the TZ env
          # var doesn't reliably take effect on Windows runners' tzdata lookups.
          # Node is preinstalled on windows-latest images.
          DATE=$(node -e '
            const d = new Date();
            const tz = "America/New_York";
            const day = parseInt(new Intl.DateTimeFormat("en-US", { day: "numeric", timeZone: tz }).format(d));
            const month = new Intl.DateTimeFormat("en-US", { month: "long", timeZone: tz }).format(d);
            const year = new Intl.DateTimeFormat("en-US", { year: "numeric", timeZone: tz }).format(d);
            const suffix = ([11, 12, 13].includes(day)) ? "th"
                         : (day % 10 === 1) ? "st"
                         : (day % 10 === 2) ? "nd"
                         : (day % 10 === 3) ? "rd" : "th";
            console.log(month + " " + day + suffix + ", " + year);
          ')

          # Stamp the visible "Unreleased" heading with $TAG - $DATE.
          # The pattern requires the line to contain ONLY whitespace + "Unreleased" + whitespace,
          # so we never accidentally replace the word inside a bullet.
          # No-op if user already stamped the heading manually.
          START=$(grep -n "<!-- @release $TAG -->" src/lib/data/changelog.md | head -1 | cut -d: -f1)
          END=$(awk -v start="$START" 'NR>start && /<!-- @release-end -->/ { print NR; exit }' src/lib/data/changelog.md)
          [ -n "$START" ] && [ -n "$END" ] && sed -i "${START},${END}s|^[[:space:]]*Unreleased[[:space:]]*$|    $TAG - $DATE|" src/lib/data/changelog.md

          # Demote older versioned sections to plain `### vX.Y.Z - Date` markdown
          # AND strip multi-line guidance HTML comments from any non-Unreleased
          # section, so the guidance fluff doesn't accumulate after each release.
          # The just-stamped $TAG section keeps its styled <div> + "New" chip but
          # loses the guidance comment. Unreleased keeps everything (template
          # carries forward to next cycle via the prepend below).
          TMP=$(mktemp)
          awk -v just_stamped="$TAG" '
            /<!-- @release Unreleased -->/   { section = "unreleased"; print; next }
            /<!-- @release v[0-9]/ {
              match($0, /v[0-9][0-9.]+/)
              ver = substr($0, RSTART, RLENGTH)
              section = (ver == just_stamped) ? "current" : "old"
              print; next
            }
            /<!-- @release-end -->/          { section = ""; in_block_comment = 0; print; next }

            # Strip multi-line HTML comments from non-Unreleased sections
            section == "current" || section == "old" {
              if (/^<!--$/) { in_block_comment = 1; next }
              if (in_block_comment && /^-->$/) { in_block_comment = 0; next }
              if (in_block_comment) { next }
            }

            # Demote styled <div> heading to plain markdown in old sections
            section == "old" && /<div class="rounded-md flex space-x-2 items-center">/ {
              in_styled = 1
              div_depth = 0
              captured = ""
            }
            in_styled {
              s = $0
              while (match(s, /<div/))    { div_depth++; s = substr(s, RSTART + 4) }
              s = $0
              while (match(s, /<\/div>/)) { div_depth--; s = substr(s, RSTART + 6) }
              if (captured == "" && match($0, /v[0-9][^<]*[^[:space:]<]/)) {
                captured = substr($0, RSTART, RLENGTH)
              }
              if (div_depth == 0) {
                print "### " captured
                in_styled = 0
              }
              next
            }

            { print }
          ' src/lib/data/changelog.md > "$TMP"
          mv "$TMP" src/lib/data/changelog.md

          # Prepend a fresh Unreleased block at the top of changelog.md so the next
          # release has a place to collect bullets.
          TMP=$(mktemp)
          {
            cat <<'FRESH'
          <!-- @release Unreleased -->
          <div class="rounded-md flex space-x-2 items-center">
            <div class="text-lg font-semibold text-white">
              Unreleased
            </div>
            <div class="bg-accent-500 px-2 font-medium rounded-md text-white">
              New
            </div>
          </div>

          #### NEW FEATURES

          #### BUG FIXES AND IMPROVEMENTS

          <!-- @release-end -->

          FRESH
            cat src/lib/data/changelog.md
          } > "$TMP"
          mv "$TMP" src/lib/data/changelog.md

          # Strip empty #### headings from non-Unreleased sections.
          #
          # Each #### heading starts a buffer that holds the heading and every line
          # underneath it until the next ####, the next <!-- @release ... -->, or
          # <!-- @release-end -->. At each flush the buffer is kept if it contains
          # any content line (bullet or paragraph) and dropped otherwise. The
          # Unreleased section keeps every buffer regardless of content so its
          # NEW FEATURES / BUG FIXES placeholders survive the cycle.
          #
          # Buffering the whole section (not just up to the first bullet) prevents
          # the heading from desynchronising from its bullets when there are 2+
          # bullets — the previous logic stopped buffering after the first bullet,
          # which let later bullets print directly to output before the buffer
          # flushed and orphaned them above the heading.
          TMP=$(mktemp)
          awk '
            function flush() {
              if (buf_size == 0) return
              if (section == "unreleased" || has_content) {
                for (i = 0; i < buf_size; i++) print buf[i]
              }
              buf_size = 0
              has_content = 0
              in_heading_block = 0
            }
            /<!-- @release Unreleased -->/ { flush(); section = "unreleased"; print; next }
            /<!-- @release v[0-9]/         { flush(); section = "version"; print; next }
            /<!-- @release-end -->/        { flush(); section = ""; print; next }
            /^####/ {
              flush()
              buf[buf_size++] = $0
              in_heading_block = 1
              next
            }
            in_heading_block {
              buf[buf_size++] = $0
              if (/^[-*]/ || /^[A-Za-z0-9]/) has_content = 1
              next
            }
            { print }
            END { flush() }
          ' src/lib/data/changelog.md > "$TMP"
          mv "$TMP" src/lib/data/changelog.md

          # Refresh Cargo.lock's `app` entry so the lockfile doesn't trail the
          # workspace version by one release. `--workspace` keeps the update
          # scoped to our crate (no registry index fetch, no transitive deps).
          (cd src-tauri && cargo update -p app --workspace)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json src/lib/data/changelog.md
          git commit -m "chore: bump to $NEW"
          git tag "$TAG"
          git push origin HEAD:main
          git push origin "$TAG"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-06
        with:
          components: clippy, rustfmt

      - name: Cache Rust target
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      # Inherit the CI gates: a tag pushed on a broken commit must not ship a
      # signed build to the auto-updater audience. (The frontend build itself
      # runs inside tauri-action below.)
      - name: Type-check (svelte-check)
        run: npm run check

      - name: Prettier check
        run: npm run lint

      - name: Frontend tests (vitest)
        run: npm test

      # The cargo gates compile the Tauri shell, whose build script reads
      # frontendDist (../build) — build the frontend first so it exists.
      - name: Build frontend
        run: npm run build

      - name: Rust formatting (cargo fmt)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust lint (cargo clippy)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust tests (cargo test)
        working-directory: src-tauri
        run: cargo test

      - name: Resolve release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          # Source of truth: src/lib/data/changelog.md. Extract the section for this tag
          # (the bump step just renamed "@release Unreleased" to "@release $TAG").
          NOTES=$(awk -v tag="$TAG" '
            $0 ~ "<!-- @release " tag " -->" { found=1; next }
            /<!-- @release-end -->/ && found { exit }
            found { print }
          ' src/lib/data/changelog.md | sed -e 's/^[[:space:]]*//' -e '/./,$!d')

          # Strip the "edit this section" instructional comment if it's all that's there
          STRIPPED=$(echo "$NOTES" | sed '/<!--/,/-->/d' | sed '/^[[:space:]]*$/d')

          if [ -z "$STRIPPED" ]; then
            echo "::warning::No content found in changelog.md for $TAG — falling back to auto-generated notes from commits"
            NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" \
              --jq .body 2>/dev/null || echo "Release $TAG.")
          fi

          # Clean the extracted notes for the release page + in-app updater modal:
          #   1. Strip HTML comments (single-line + multi-line) so guidance text
          #      inside the changelog never leaks out.
          #   2. Demote the styled <div> version-heading to a plain markdown
          #      heading. The modal renders these notes as untrusted remote text
          #      (HTML escaped, never executed), so a raw <div> would otherwise
          #      show as literal tag soup instead of a title. Depth-counted so the
          #      nested divs + "New" chip are all consumed; the version/date line
          #      is captured (mirrors the demotion in the bump step above).
          NOTES_CLEAN=$(echo "$NOTES" | awk '
            /<!--/ { in_comment=1 }
            in_comment && /-->/ { in_comment=0; next }
            in_comment { next }
            /<div class="rounded-md flex space-x-2 items-center">/ {
              in_styled=1; div_depth=0; captured=""
            }
            in_styled {
              s = $0
              while (match(s, /<div/))    { div_depth++; s = substr(s, RSTART + 4) }
              s = $0
              while (match(s, /<\/div>/)) { div_depth--; s = substr(s, RSTART + 6) }
              if (captured == "" && match($0, /v[0-9][^<]*[^[:space:]<]/)) {
                captured = substr($0, RSTART, RLENGTH)
              }
              if (div_depth == 0) { if (captured != "") print "### " captured; in_styled=0 }
              next
            }
            { print }
          ')

          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$NOTES_CLEAN"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign, and publish release
        # SHA-pinned: this action runs with the updater signing key and a
        # contents:write token in env — a hijacked mutable tag could
        # exfiltrate them.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.version.outputs.new_tag }}
          releaseName: ${{ steps.version.outputs.new_tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
