[package]
name = "app"
version = "0.2.7"
description = "Raid mechanic announcer for Lost Ark"
authors = ["shotgun175"]
license = "GNU General Public License v3.0"
repository = "https://github.com/shotgun175/Raid-Mech-Announcer"
default-run = "app"
edition = "2024"
rust-version = "1.90.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
anyhow = "1.0.100"
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.9.5", features = ["image-png", "tray-icon"] }
tokio = { version = "1.48.0", features = ["rt", "macros"] }
log = "0.4.18"
flexi_logger = { version = "0.31.7", default-features = false }
uuid = { version = "1.17.0", features = ["v4"] }
notify = "7"
rfd = { version = "0.17.2", features = ["common-controls-v6"] }
thiserror = "2.0.17"
strum = "0.27.2"
strum_macros = "0.27.2"
dirs = "6.0.0"
rodio = { version = "0.19", default-features = false, features = ["mp3"] }


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2.3.1"
tauri-plugin-clipboard-manager = "2.3.0"
tauri-plugin-updater = "2.9.0"
tauri-plugin-opener = "2.5.0"
tauri-plugin-window-state = "2.4.0"
tauri-plugin-process = "2.3.0"
tauri-plugin-global-shortcut = "2.3.0"
tauri-plugin-single-instance = "2.3.4"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "s" # Optimize for binary size
strip = true # Remove debug symbols

[profile.dev.package."*"]
debug = false # Disable debug symbols for dependencies
