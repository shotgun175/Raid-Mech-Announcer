<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mech Announcer — Lost Ark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0a0a0a; font-family: 'Inter', -apple-system, system-ui, sans-serif; color: #fafafa; font-size: 14px; -webkit-font-smoothing: antialiased; }
    #root { height: 100%; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #404040; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #525252; }
    ::-webkit-scrollbar-corner { background: #0a0a0a; }
    input, textarea, select, button { font-family: inherit; }
    input[type="range"] { -webkit-appearance: none; height: 4px; background: #262626; border-radius: 2px; outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #38bdf8; border-radius: 50%; cursor: pointer; border: 2px solid #0a0a0a; box-shadow: 0 0 8px rgba(56,189,248,0.5); }
    code, [style*="monospace"] { font-family: 'JetBrains Mono', 'Geist Mono', ui-monospace, monospace; }
    @keyframes mech-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.4); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// Sample raid data. Severity: normal | major | wipe
const SAMPLE_RAIDS = [
  {
    id: "serca-g1", raid: "Serca", gate: 1, boss: "Witch of Agony, Serca",
    bossType: "HUMAN", weakness: "No Weakness", tauntable: false, totalBars: 300,
    mechanics: [
      { id: "sg1-m1", name: "Saws & Spikes", hpBar: 270, phase: 1, triggerType: "hp", repeatSecs: 60, severity: "major", ttsEnabled: true, ttsText: "Saws and Spikes", notes: "Spikes appear every ~1min. Smaller arena remains. From top: 2 spikes, back 1, left 2." },
      { id: "sg1-m2", name: "Nail Just Guard", hpBar: 240, phase: 1, triggerType: "hp", repeatSecs: null, severity: "major", ttsEnabled: true, ttsText: "Nail Just Guard", notes: "Boss moves middle. Move with tiles. After 1st JG boss goes right." },
      { id: "sg1-m3", name: "Moral Walls", hpBar: 195, phase: 1, triggerType: "hp", repeatSecs: null, severity: "normal", ttsEnabled: false, ttsText: "", notes: "Dodge spikes 5 wall rows. Goes to Crossover." },
      { id: "sg1-m4", name: "Bomberman", hpBar: 175, phase: 2, triggerType: "hp", repeatSecs: 70, severity: "major", ttsEnabled: true, ttsText: "Bomberman", notes: "P2 starts. Every ~70s. Move/explode to x shape on edge." },
      { id: "sg1-m5", name: "Survival Run", hpBar: 105, phase: 2, triggerType: "hp", repeatSecs: null, severity: "major", ttsEnabled: true, ttsText: "Survival Run", notes: "Award special 3 items by surviving 8 actions." },
      { id: "sg1-m6", name: "Flame Maiden", hpBar: 90, phase: 3, triggerType: "hp", repeatSecs: 60, severity: "wipe", ttsEnabled: true, ttsText: "Flame Maiden Counter", notes: "P3. Counter every ~1min. Smaller arena. WIPE if missed." }
    ]
  },
  {
    id: "serca-g2", raid: "Serca", gate: 2, boss: "Corvus Tul Rak",
    bossType: "ANCIENT", weakness: "Weak to Light", tauntable: false, totalBars: 300,
    mechanics: [
      { id: "sg2-m1", name: "Wing Prediction", hpBar: 285, phase: null, triggerType: "hp+timer", repeatSecs: 80, severity: "major", ttsEnabled: true, ttsText: "Wing Prediction", notes: "Prediction pattern into whirlpool. Repeats every 80s." },
      { id: "sg2-m2", name: "Veiled Stagger", hpBar: 240, phase: null, triggerType: "hp", repeatSecs: null, severity: "major", ttsEnabled: true, ttsText: "Veiled Stagger", notes: "Find real boss, Just Guard, stagger and dodge. 2 Repeat Attacks follow." },
      { id: "sg2-m3", name: "Guard Drain", hpBar: 195, phase: null, triggerType: "hp", repeatSecs: null, severity: "major", ttsEnabled: true, ttsText: "Guard Drain", notes: "Multiple Just Guards and Counter — each JG deals stagger." },
      { id: "sg2-m4", name: "Find Corvuth", hpBar: 120, phase: null, triggerType: "hp", repeatSecs: null, severity: "normal", ttsEnabled: false, ttsText: "", notes: "Check clones, deal damage, avoid puddles and detection." },
      { id: "sg2-m5", name: "Stagger Helping Pattern", hpBar: null, timerSecs: 510, phase: null, triggerType: "timer", repeatSecs: null, severity: "normal", ttsEnabled: true, ttsText: "Stagger Helping Pattern", notes: "At 8:30 — always comes out at this time." },
      { id: "sg2-m6", name: "Pizza Prediction", hpBar: 60, phase: null, triggerType: "hp", repeatSecs: null, severity: "major", ttsEnabled: true, ttsText: "Pizza Prediction", notes: "Prediction pattern into spinning pizza slices." }
    ]
  },
  {
    id: "thaem-g4", raid: "Thaemine", gate: 4, boss: "Darkness Legion Commander Thaemine",
    bossType: "DEMONIC", weakness: "No Weakness", tauntable: false, totalBars: 350,
    mechanics: [
      { id: "t4-m1", name: "Stagger Check", hpBar: 320, phase: 1, triggerType: "hp", repeatSecs: null, severity: "major", ttsEnabled: true, ttsText: "Stagger Check incoming", notes: "Full party stagger. Use stagger skills." },
      { id: "t4-m2", name: "Expert Destroyer", hpBar: 280, phase: 1, triggerType: "hp", repeatSecs: null, severity: "wipe", ttsEnabled: true, ttsText: "Expert Destroyer", notes: "Wipe mech. Gather stacks, resolve position." },
      { id: "t4-m3", name: "Phase 2 Transition", hpBar: 220, phase: 2, triggerType: "hp", repeatSecs: null, severity: "normal", ttsEnabled: true, ttsText: "Phase 2 starting", notes: "Boss dives. Quick reposition." }
    ]
  }
];

// LOA Logs' actual boss HP bar colors (src/lib/constants/encounters.ts)
const BOSS_HP_COLORS = ["#D16F23", "#9F3930", "#582469", "#2B3A63", "#246977", "#798816", "#E7B826"];

const SEVERITY = {
  normal: { label: "Normal", color: "#38bdf8", dim: "rgba(56,189,248,0.12)", border: "rgba(56,189,248,0.4)" },
  major:  { label: "Major",  color: "#fb923c", dim: "rgba(251,146,60,0.12)", border: "rgba(251,146,60,0.4)" },
  wipe:   { label: "Wipe",   color: "#f87171", dim: "rgba(248,113,113,0.15)", border: "rgba(248,113,113,0.5)" }
};
const PHASE_COLORS = { 1: "#38bdf8", 2: "#fb923c", 3: "#f87171", 4: "#a78bfa" };

const formatTimer = (s) => { if (s==null) return ""; const m=Math.floor(s/60); return `${m}:${String(s%60).padStart(2,"0")}`; };

window.APP_DATA = { SAMPLE_RAIDS, BOSS_HP_COLORS, SEVERITY, PHASE_COLORS, formatTimer };


// LOA Logs palette: neutral-900/950 bgs, sky/blue accent. Using their tokens.
const C = {
  bg: "#0a0a0a",           // neutral-950
  surface: "rgba(23,23,23,0.7)", // neutral-900/70 + blur
  panel: "#171717",        // neutral-900
  elevated: "#262626",     // neutral-800
  hover: "#202020",
  border: "#262626",       // neutral-800
  borderLight: "#404040",  // neutral-700
  text: "#fafafa",         // white
  textSec: "#a3a3a3",      // neutral-400
  textMut: "#525252",      // neutral-600
  accent: "#38bdf8",        // sky-400 (LOA default)
  accentHover: "#0ea5e9",  // sky-500
  accentDim: "rgba(56,189,248,0.1)",
  accentBorder: "rgba(56,189,248,0.3)"
};

const Badge = ({ label, color, bg, border, small }) => (
  <span style={{
    display: "inline-flex", alignItems: "center",
    padding: small ? "1px 6px" : "2px 8px",
    borderRadius: 3,
    background: bg || "transparent",
    border: `1px solid ${border || color || C.accent}`,
    color: color || C.accent,
    fontSize: small ? 9.5 : 10.5,
    fontWeight: 600,
    letterSpacing: "0.05em",
    textTransform: "uppercase",
    whiteSpace: "nowrap",
    lineHeight: 1.4
  }}>{label}</span>
);

const IconBtn = ({ onClick, title, children, danger }) => {
  const [h, setH] = useState(false);
  return (
    <button onClick={onClick} title={title}
      onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        background: h ? (danger ? "rgba(248,113,113,0.1)" : C.hover) : "transparent",
        border: "none", cursor: "pointer",
        color: danger ? (h ? "#fca5a5" : "#f87171") : (h ? C.text : C.textSec),
        padding: "4px 7px", borderRadius: 4, fontSize: 12,
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        transition: "color 0.15s, background 0.15s"
      }}>{children}</button>
  );
};

// HP Timeline — MAX HP on LEFT, 0 on RIGHT. Filled portion shrinks from right as HP drops.
const HPTimeline = ({ mechanics, totalBars, currentBar }) => {
  const hpMechs = mechanics.filter(m => m.hpBar != null).sort((a,b) => b.hpBar - a.hpBar);
  const cur = currentBar == null ? totalBars : currentBar;
  const drainPct = (cur / totalBars) * 100;
  return (
    <div style={{ position: "relative", height: 44, padding: "10px 0 14px" }}>
      <div style={{ position: "absolute", left: 0, right: 0, top: 18, height: 8, background: "#0c0c0c", borderRadius: 3, overflow: "hidden", border: `1px solid ${C.border}` }}>
        <div style={{
          position: "absolute", left: 0, top: 0, bottom: 0,
          width: `${drainPct}%`,
          background: "linear-gradient(90deg, #f87171 0%, #facc15 55%, #4ade80 100%)",
          transition: "width 0.3s"
        }} />
        {drainPct < 100 && (
          <div style={{
            position: "absolute", right: 0, top: 0, bottom: 0,
            width: `${100 - drainPct}%`,
            background: "repeating-linear-gradient(-45deg, rgba(255,255,255,0.02) 0 4px, rgba(255,255,255,0.05) 4px 8px)",
            borderLeft: "1px dashed rgba(255,255,255,0.18)"
          }} />
        )}
      </div>
      {hpMechs.map(m => {
        const pct = (m.hpBar / totalBars) * 100;
        const sev = SEVERITY[m.severity];
        const drained = m.hpBar > cur;
        return (
          <div key={m.id} title={`${m.name} @ ${m.hpBar}×`}
            style={{ position: "absolute", left: `${pct}%`, top: 10, transform: "translateX(-50%)", pointerEvents: "none" }}>
            <div style={{
              width: 2, height: 24,
              background: sev.color, borderRadius: 1,
              opacity: drained ? 0.28 : 1,
              boxShadow: !drained ? `0 0 5px ${sev.color}` : "none"
            }} />
            <div style={{
              fontSize: 9, fontFamily: "ui-monospace, monospace",
              color: drained ? C.textMut : sev.color,
              opacity: drained ? 0.55 : 1,
              marginTop: 2, transform: "translateX(-50%)", position: "relative", left: 1,
              fontWeight: 700, whiteSpace: "nowrap"
            }}>{m.hpBar}</div>
          </div>
        );
      })}
      {/* Phase boundary lines: first mechanic with a given phase defines that phase's start */}
      {(() => {
        const phases = {};
        [...mechanics].filter(m => m.hpBar != null && m.phase != null).sort((a,b) => b.hpBar - a.hpBar).forEach(m => { if (!phases[m.phase]) phases[m.phase] = m.hpBar; });
        return Object.entries(phases).filter(([p]) => parseInt(p) > 1).map(([p, bar]) => {
          const pct = (bar / totalBars) * 100;
          const pc = PHASE_COLORS[parseInt(p)];
          const drained = bar > cur;
          return (
            <div key={"phase-"+p} style={{ position: "absolute", left: `${pct}%`, top: 15, pointerEvents: "none" }}>
              <div style={{ width: 1, height: 14, background: pc, opacity: drained ? 0.25 : 0.7, boxShadow: drained ? "none" : `0 0 4px ${pc}` }} />
              <div style={{ fontSize: 8, fontFamily: "ui-monospace, monospace", color: pc, opacity: drained ? 0.4 : 0.9, fontWeight: 800, transform: "translateX(-50%)", whiteSpace: "nowrap", marginTop: 1 }}>P{p}</div>
            </div>
          );
        });
      })()}
      <span style={{ position: "absolute", left: 2, bottom: 0, fontSize: 9, color: C.textMut, fontFamily: "ui-monospace, monospace", fontWeight: 600 }}>{totalBars}× <span style={{ opacity: 0.5 }}>MAX</span></span>
      <span style={{ position: "absolute", right: 2, bottom: 0, fontSize: 9, color: C.textMut, fontFamily: "ui-monospace, monospace", fontWeight: 600 }}><span style={{ opacity: 0.5 }}>DEAD</span> 0×</span>
    </div>
  );
};

// Mech row in editor table
const MechRow = ({ mech, onEdit, onDelete, isNext, isPast }) => {
  const [h, setH] = useState(false);
  const sev = SEVERITY[mech.severity];
  const pc = mech.phase ? PHASE_COLORS[mech.phase] : null;
  return (
    <div onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        display: "grid", gridTemplateColumns: "78px 32px 1fr 110px 86px 78px",
        padding: "8px 14px", borderBottom: `1px solid ${C.border}`,
        background: isNext ? "rgba(56,189,248,0.06)" : (h ? C.hover : "transparent"),
        borderLeft: isNext ? `2px solid ${C.accent}` : "2px solid transparent",
        opacity: isPast ? 0.4 : 1, alignItems: "center",
        transition: "background 0.15s"
      }}>
      <div style={{ fontFamily: "ui-monospace, monospace", fontSize: 14, fontWeight: 700, color: isNext ? C.accent : C.text }}>
        {mech.hpBar != null
          ? <span>{mech.hpBar}<span style={{ fontSize: 9, color: C.textMut, fontWeight: 400, marginLeft: 2 }}>×</span></span>
          : <span style={{ fontSize: 12, color: "#fbbf24" }}>⏱ {formatTimer(mech.timerSecs)}</span>}
      </div>
      <div>
        {pc && <div style={{ width: 19, height: 19, borderRadius: 3, background: `${pc}20`, border: `1px solid ${pc}60`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 9, fontWeight: 700, color: pc, fontFamily: "ui-monospace, monospace" }}>P{mech.phase}</div>}
      </div>
      <div style={{ paddingRight: 12, minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 2 }}>
          <span style={{ fontWeight: 600, fontSize: 13, color: isNext ? C.accent : C.text }}>{mech.name}</span>
          {isNext && <span style={{ fontSize: 9, color: C.accent, fontWeight: 700, letterSpacing: "0.06em" }}>▶ NEXT</span>}
        </div>
        {mech.notes && <div style={{ fontSize: 11, color: C.textSec, lineHeight: 1.4, whiteSpace: "nowrap", textOverflow: "ellipsis", overflow: "hidden" }}>{mech.notes}</div>}
      </div>
      <div><Badge label={sev.label} color={sev.color} bg={sev.dim} border={sev.border} small /></div>
      <div style={{ fontSize: 11, color: C.textSec, display: "flex", gap: 6, alignItems: "center", fontFamily: "ui-monospace, monospace" }}>
        {mech.repeatSecs && <span style={{ color: "#a78bfa" }}>↻{formatTimer(mech.repeatSecs)}</span>}
        {mech.ttsEnabled && <span title="TTS enabled" style={{ color: C.accent }}>🔊</span>}
      </div>
      <div style={{ display: "flex", justifyContent: "flex-end" }}>
        <IconBtn onClick={() => onEdit(mech)} title="Edit">✎</IconBtn>
        <IconBtn onClick={() => onDelete(mech.id)} title="Delete" danger>✕</IconBtn>
      </div>
    </div>
  );
};

// Add/edit modal
const MechModal = ({ mech, onSave, onClose, totalBars }) => {
  const isEdit = !!mech?.id;
  const [f, setF] = useState(mech || { name:"", severity:"major", triggerType:"hp", hpBar:"", phase:"", repeatSecs:"", timerSecs:"", ttsEnabled:true, ttsText:"", notes:"" });
  const s = (k, v) => setF(x => ({ ...x, [k]: v }));
  const save = () => {
    if (!f.name.trim()) return;
    onSave({ ...f, id: f.id || `m-${Date.now()}`,
      hpBar: f.hpBar !== "" ? parseInt(f.hpBar) : null,
      phase: f.phase !== "" ? parseInt(f.phase) : null,
      repeatSecs: f.repeatSecs !== "" ? parseInt(f.repeatSecs) : null,
      timerSecs: f.timerSecs !== "" ? parseInt(f.timerSecs) : null });
  };
  const Label = ({ children }) => <div style={{ fontSize: 10, color: C.textSec, marginBottom: 5, fontWeight: 600, letterSpacing: "0.05em", textTransform: "uppercase" }}>{children}</div>;
  const inpStyle = { width: "100%", background: "#0a0a0a", border: `1px solid ${C.border}`, borderRadius: 4, padding: "7px 10px", color: C.text, fontSize: 13, outline: "none", fontFamily: "inherit" };
  const selStyle = { ...inpStyle, background: C.elevated };

  return (
    <div onClick={e => e.target === e.currentTarget && onClose()} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", backdropFilter: "blur(4px)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000 }}>
      <div style={{ background: C.panel, border: `1px solid ${C.borderLight}`, borderRadius: 8, width: 470, maxHeight: "90vh", overflow: "auto", boxShadow: "0 20px 60px rgba(0,0,0,0.7)" }}>
        <div style={{ padding: "14px 18px", borderBottom: `1px solid ${C.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontWeight: 600, fontSize: 14 }}>{isEdit ? "Edit Mechanic" : "Add Mechanic"}</span>
          <IconBtn onClick={onClose}>✕</IconBtn>
        </div>
        <div style={{ padding: "18px" }}>
          <div style={{ marginBottom: 14 }}><Label>Mechanic Name</Label><input style={inpStyle} value={f.name} onChange={e => s("name", e.target.value)} placeholder="e.g. Saws & Spikes" /></div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 14 }}>
            <div><Label>Severity</Label><select style={selStyle} value={f.severity} onChange={e => s("severity", e.target.value)}><option value="normal">Normal</option><option value="major">Major</option><option value="wipe">Wipe Mech</option></select></div>
            <div><Label>Trigger</Label><select style={selStyle} value={f.triggerType} onChange={e => s("triggerType", e.target.value)}><option value="hp">HP Bar</option><option value="timer">Timer (from pull)</option><option value="hp+timer">HP + Repeating</option></select></div>
          </div>
          {(f.triggerType === "hp" || f.triggerType === "hp+timer") && (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 14 }}>
              <div><Label>HP Bar Threshold</Label><input type="number" style={inpStyle} value={f.hpBar} onChange={e => s("hpBar", e.target.value)} placeholder={`/${totalBars}`} /></div>
              <div><Label>Phase</Label><select style={selStyle} value={f.phase === "" || f.phase == null ? "" : String(f.phase)} onChange={e => s("phase", e.target.value || "")}><option value="">No Phase</option><option value="1">Phase 1</option><option value="2">Phase 2</option><option value="3">Phase 3</option><option value="4">Phase 4</option></select></div>
            </div>
          )}
          {f.triggerType === "timer" && (
            <div style={{ marginBottom: 14 }}><Label>Timer (seconds from pull)</Label><input type="number" style={inpStyle} value={f.timerSecs} onChange={e => s("timerSecs", e.target.value)} placeholder="e.g. 510 for 8:30" /><div style={{ fontSize: 10, color: C.textMut, marginTop: 3, fontFamily: "ui-monospace, monospace" }}>{f.timerSecs ? `= ${formatTimer(parseInt(f.timerSecs))} from pull` : ""}</div></div>
          )}
          {(f.triggerType === "hp+timer") && (
            <div style={{ marginBottom: 14 }}><Label>Repeat Interval (seconds)</Label><input type="number" style={inpStyle} value={f.repeatSecs} onChange={e => s("repeatSecs", e.target.value)} placeholder="e.g. 60" /><div style={{ fontSize: 10, color: C.textMut, marginTop: 3, fontFamily: "ui-monospace, monospace" }}>{f.repeatSecs ? `Repeats every ${formatTimer(parseInt(f.repeatSecs))} after first trigger` : ""}</div></div>
          )}
          <div style={{ background: "#0f0f0f", border: `1px solid ${C.border}`, borderRadius: 5, padding: "12px 14px", marginBottom: 14 }}>
            <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", fontSize: 12.5, color: C.text, marginBottom: f.ttsEnabled ? 10 : 0 }}>
              <input type="checkbox" checked={f.ttsEnabled} onChange={e => s("ttsEnabled", e.target.checked)} style={{ accentColor: C.accent, width: 13, height: 13 }} />
              Text-to-Speech announcement
            </label>
            {f.ttsEnabled && (<><Label>TTS Text</Label><input style={inpStyle} value={f.ttsText} onChange={e => s("ttsText", e.target.value)} placeholder={f.name || "Announcement..."} /></>)}
          </div>
          <div><Label>Notes</Label><textarea value={f.notes} onChange={e => s("notes", e.target.value)} placeholder="Strategy notes..." style={{ ...inpStyle, minHeight: 66, resize: "vertical", lineHeight: 1.5, fontSize: 12 }} /></div>
        </div>
        <div style={{ padding: "12px 18px", borderTop: `1px solid ${C.border}`, display: "flex", justifyContent: "flex-end", gap: 8 }}>
          <button onClick={onClose} style={{ background: C.elevated, border: `1px solid ${C.border}`, borderRadius: 4, padding: "7px 14px", color: C.textSec, cursor: "pointer", fontSize: 12.5 }}>Cancel</button>
          <button onClick={save} disabled={!f.name.trim()} style={{ background: C.accentDim, border: `1px solid ${C.accentBorder}`, borderRadius: 4, padding: "7px 14px", color: C.accent, cursor: f.name.trim() ? "pointer" : "not-allowed", fontSize: 12.5, fontWeight: 600, opacity: f.name.trim() ? 1 : 0.5 }}>{isEdit ? "Save" : "Add"}</button>
        </div>
      </div>
    </div>
  );
};

window.EC = { C, Badge, IconBtn, HPTimeline, MechRow, MechModal };


const EditorView = ({ raids, setRaids, selectedGateId, setSelectedGateId, currentBar, setCurrentBar, liveGateId }) => {
  const [showModal, setShowModal] = useState(false);
  const [editMech, setEditMech] = useState(null);
  const gate = raids.find(r => r.id === selectedGateId) || raids[0];

  const [p, ...rest] = up;
  const sev = SEVERITY[p.severity];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 3, minWidth: 300 }}>

          <div style={{ minWidth: 0, flex: 1 }}>

            </div>
            <div style={{ fontSize: 17, fontWeight: 700, color: C.text, lineHeight: 1.15 }}>{p.name}</div>
          </div>
          <div style={{ textAlign: "right", flexShrink: 0, marginLeft: 12 }}>

            <div style={{ fontSize: 9, color: C.textMut, textTransform: "uppercase", letterSpacing: "0.06em", marginTop: 2 }}>bars away</div>
          </div>
        </div>
        <div style={{ height: 2, background: "rgba(255,255,255,0.06)", borderRadius: 1, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${progress * 100}%`, background: sev.color, transition: "width 0.3s" }} />
        </div>
        {p.repeatSecs && <div style={{ marginTop: 7, fontSize: 10, color: "#a78bfa", fontFamily: "ui-monospace, monospace" }}>↻ Repeats every {formatTimer(p.repeatSecs)}</div>}
      </div>
      {rest.map(m => {
        const s = SEVERITY[m.severity];
        return (
          <div key={m.id} style={{ background: "rgba(10,10,10,0.75)", backdropFilter: "blur(8px)", border: "1px solid rgba(64,64,64,0.3)", borderLeft: `2px solid ${s.color}80`, borderRadius: "0 4px 4px 0", padding: "6px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>

              {m.phase && <span style={{ fontSize: 9, color: PHASE_COLORS[m.phase], opacity: 0.8, fontFamily: "ui-monospace, monospace" }}>P{m.phase}</span>}
            </div>
            <span style={{ fontSize: 10.5, fontFamily: "ui-monospace, monospace", color: C.textMut }}>{m.hpBar}</span>

};

// --- Variant 5: Combined (HUD bar + card stack) ---
const OLCombined = ({ mechanics, currentBar, totalBars, gateName, bossName }) => {
  const up = upcomingFrom(mechanics, currentBar).slice(0, 4);
  const barIdx = Math.max(0, Math.ceil(currentBar / totalBars * BOSS_HP_COLORS.length) - 1);
  const barColor = BOSS_HP_COLORS[barIdx % BOSS_HP_COLORS.length];
  const next = up[0];
  const rest = up.slice(1);
  const sev = next ? SEVERITY[next.severity] : null;
  const barsAway = next ? currentBar - next.hpBar : null;
  const progress = next ? Math.min(1, Math.max(0, 1 - barsAway / 30)) : 0;
  const pct = (currentBar / totalBars) * 100;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 4, width: 400, fontFamily: "Inter, sans-serif" }}>
      {/* HUD boss bar (LOA-style, draining) */}
      <div style={{ background: "rgba(23,23,23,0.85)", backdropFilter: "blur(12px)", border: "1px solid rgba(64,64,64,0.5)", borderRadius: 4, overflow: "hidden", boxShadow: "0 8px 32px rgba(0,0,0,0.7)" }}>
        <div style={{ position: "relative", height: 26, background: "rgba(0,0,0,0.5)", borderBottom: "1px solid rgba(0,0,0,0.5)" }}>
          <div style={{ position: "absolute", inset: 0, background: barColor, opacity: 0.78, width: `${pct}%`, transition: "width 0.3s, background 0.3s" }} />
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontSize: 11.5, color: "white", fontWeight: 500, letterSpacing: "0.01em", textShadow: "0 1px 2px rgba(0,0,0,0.9)" }}>
            <span style={{ opacity: 0.9 }}>{bossName}</span>
            <span style={{ fontFamily: "ui-monospace, monospace", fontWeight: 600 }}>{pct.toFixed(1)}%</span>
          </div>
          <div style={{ position: "absolute", right: 9, top: "50%", transform: "translateY(-50%)", fontSize: 11, fontFamily: "ui-monospace, monospace", color: "white", fontWeight: 700, textShadow: "0 1px 2px rgba(0,0,0,0.9)" }}>{currentBar}×</div>
          <div style={{ position: "absolute", left: 9, top: "50%", transform: "translateY(-50%)", fontSize: 9, color: C.accent, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", textShadow: "0 1px 2px rgba(0,0,0,0.9)" }}>{gateName}</div>
          {/* tick marks for ALL upcoming mechs on the bar itself */}
          {mechanics.filter(m => m.hpBar != null && m.hpBar <= currentBar).map(m => {
            const ms = SEVERITY[m.severity];
            return <div key={m.id} style={{ position: "absolute", left: `${(m.hpBar/totalBars)*100}%`, top: 0, width: 2, height: "100%", background: ms.color, boxShadow: `0 0 6px ${ms.color}` }} />;
          })}
        </div>
      </div>

      {/* Primary upcoming card */}
      {next && (
        <div style={{ background: "rgba(10,10,10,0.9)", backdropFilter: "blur(12px)", border: `1px solid ${sev.color}66`, borderLeft: `3px solid ${sev.color}`, borderRadius: "0 5px 5px 0", padding: "12px 15px", boxShadow: `0 8px 32px rgba(0,0,0,0.7), 0 0 24px ${sev.color}1a` }}>
          {/* Compute repeat cycle state */}
          {(() => {
            // Has this mech already fired? If repeatSecs, find next repeat bar
            const fired = barsAway <= 0;
            let repeatNextBar = null, repeatProgress = 0, repeatBarsLeft = null;
            if (fired && next.repeatSecs) {
              // How many bars does repeatSecs map to? Approximate: 1 bar ≈ some seconds.
              // We track repeat cycles by bar distance: each repeat fires every repeatSecs/1 bars (simulated).
              // In sim, bars drain at 1 bar/tick. So repeatSecs is also ~repeatSecs bars.
              const repeatBars = next.repeatSecs; // treat repeatSecs as bar-equivalent in sim
              const barsSinceFire = next.hpBar - currentBar; // how far past the trigger we are
              const cycle = Math.floor(barsSinceFire / repeatBars);
              repeatNextBar = next.hpBar - (cycle + 1) * repeatBars;
              repeatBarsLeft = currentBar - repeatNextBar;
              repeatProgress = 1 - repeatBarsLeft / repeatBars;
            }
            const showingRepeat = fired && next.repeatSecs && repeatNextBar != null && repeatNextBar > 0;
            const displayBar = showingRepeat ? repeatBarsLeft : barsAway;
            const displayLabel = showingRepeat ? "until repeat" : barsAway === 0 ? "incoming" : "bars away";
            const urgentRepeat = showingRepeat && repeatBarsLeft <= 10;
            const barFill = showingRepeat ? repeatProgress : progress;
            return (<>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 9 }}>
                <div style={{ minWidth: 0, flex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 3 }}>
                    <Badge label={sev.label} color={sev.color} bg={sev.dim} border={sev.border} small />
                    {next.phase && <span style={{ fontSize: 10, color: PHASE_COLORS[next.phase], fontWeight: 700, letterSpacing: "0.08em" }}>PHASE {next.phase}</span>}
                    {next.repeatSecs && (
                      <span style={{ fontSize: 10, color: showingRepeat ? (urgentRepeat ? sev.color : "#a78bfa") : "#a78bfa", fontFamily: "ui-monospace, monospace", fontWeight: showingRepeat ? 700 : 400, animation: urgentRepeat ? "mech-pulse 1s infinite" : "none" }}>
                        ↻ {showingRepeat ? `repeating · ${formatTimer(next.repeatSecs)}` : formatTimer(next.repeatSecs)}
                      </span>
                    )}
                  </div>
                  <div style={{ fontSize: 16.5, fontWeight: 700, color: showingRepeat ? C.textSec : C.text, lineHeight: 1.15, letterSpacing: "-0.01em" }}>{next.name}</div>
                  {showingRepeat && <div style={{ fontSize: 10, color: C.textMut, marginTop: 2, fontFamily: "ui-monospace, monospace" }}>fired @ {next.hpBar}× · next @ {Math.max(0, repeatNextBar)}×</div>}
                </div>
                <div style={{ textAlign: "right", flexShrink: 0, marginLeft: 12 }}>
                  <div style={{ fontSize: 23, fontFamily: "ui-monospace, monospace", fontWeight: 700, color: urgentRepeat ? sev.color : (showingRepeat ? "#a78bfa" : sev.color), lineHeight: 1 }}>
                    {displayBar <= 0 ? "NOW" : displayBar}
                  </div>
                  <div style={{ fontSize: 9, color: C.textMut, textTransform: "uppercase", letterSpacing: "0.06em", marginTop: 2 }}>{displayLabel}</div>
                </div>
              </div>
              <div style={{ height: 2, background: "rgba(255,255,255,0.06)", borderRadius: 1, overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${Math.min(100, barFill * 100)}%`, background: showingRepeat ? (urgentRepeat ? sev.color : "#a78bfa") : sev.color, transition: "width 0.3s" }} />
              </div>
            </>);
          })()}
        </div>
      )}

      {/* Rest of upcoming mechs as slim rows */}
      {rest.map(m => {
        const s = SEVERITY[m.severity];
        return (
          <div key={m.id} style={{ background: "rgba(10,10,10,0.75)", backdropFilter: "blur(8px)", border: "1px solid rgba(64,64,64,0.3)", borderLeft: `2px solid ${s.color}80`, borderRadius: "0 4px 4px 0", padding: "6px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
              <div style={{ width: 4, height: 4, borderRadius: "50%", background: s.color, opacity: 0.7 }} />
              <span style={{ fontSize: 11.5, color: C.textSec, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{m.name}</span>
              {m.phase && <span style={{ fontSize: 9, color: PHASE_COLORS[m.phase], opacity: 0.8, fontFamily: "ui-monospace, monospace" }}>P{m.phase}</span>}
              {m.repeatSecs && <span style={{ fontSize: 9, color: "#a78bfa", fontFamily: "ui-monospace, monospace" }}>↻</span>}
            </div>
            <div style={{ display: "flex", alignItems: "baseline", gap: 4 }}>
              <span style={{ fontSize: 11, fontFamily: "ui-monospace, monospace", color: C.textMut, fontWeight: 600 }}>{m.hpBar}</span>
              <span style={{ fontSize: 9, color: C.textMut }}>×</span>
            </div>
          </div>
        );
      })}
    </div>
  );
};

const OLPill = ({ mechanics, currentBar }) => {
  const next = upcomingFrom(mechanics, currentBar)[0];
  if (!next) return null;
  const sev = SEVERITY[next.severity];
  const barsAway = currentBar - next.hpBar;
  const urgent = barsAway <= 10;
  return (
    <div style={{ background: urgent ? `${sev.color}26` : "rgba(23,23,23,0.85)", backdropFilter: "blur(10px)", border: `1px solid ${urgent ? sev.color : "rgba(64,64,64,0.5)"}`, borderRadius: 24, padding: "7px 18px", display: "inline-flex", alignItems: "center", gap: 10, boxShadow: urgent ? `0 0 20px ${sev.color}60, 0 4px 20px rgba(0,0,0,0.6)` : "0 4px 20px rgba(0,0,0,0.5)", transition: "all 0.3s", userSelect: "none" }}>

      {next.phase && <span style={{ fontSize: 10, color: PHASE_COLORS[next.phase], fontWeight: 700, borderLeft: `1px solid ${C.border}`, paddingLeft: 10, fontFamily: "ui-monospace, monospace" }}>P{next.phase}</span>}

};

const OverlayView = ({ raids, selectedGateId }) => {
  const gate = raids.find(r => r.id === selectedGateId) || raids[0];
  const [variant, setVariant] = useState("combined");
  const [simBar, setSimBar] = useState(gate?.totalBars || 300);
  const [playing, setPlaying] = useState(false);
  const [speed, setSpeed] = useState(3);
  const timerRef = useRef(null);
  const firedRef = useRef(new Set()); // tracks which mech ids have already been announced this sim run
  const [lastAnnounced, setLastAnnounced] = useState(null); // for visual toast

  const getSettings = () => window.__mechSettings || { lead: 10, vol: 80, pitch: 1, hook: "" };

  const fireAnnouncement = (mech) => {
    const cfg = getSettings();
    // TTS
    if (mech.ttsEnabled) {
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(mech.ttsText || mech.name);
        u.volume = (cfg.vol ?? 80) / 100;
        u.pitch = cfg.pitch ?? 1;
        speechSynthesis.speak(u);
      } catch(e) { console.warn("TTS error", e); }
    }
    // Discord webhook
    if (cfg.hook) {
      const sevColor = { normal: 0x38bdf8, major: 0xfb923c, wipe: 0xf87171 }[mech.severity] || 0x38bdf8;
      const desc = [
        mech.phase ? `Phase ${mech.phase}` : null,
        mech.hpBar != null ? `HP Bar: ${mech.hpBar}/${gate.totalBars}` : null,
        mech.repeatSecs ? `Repeats every ${formatTimer(mech.repeatSecs)}` : null,
        mech.notes || null
      ].filter(Boolean).join(" · ");
      fetch(cfg.hook, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ embeds: [{ title: `${mech.severity === "wipe" ? "💀" : mech.severity === "major" ? "⚠️" : "ℹ️"} ${mech.name}`, description: desc, color: sevColor, footer: { text: `Mech Announcer · ${gate.raid} G${gate.gate}` } }] })
      }).catch(e => console.warn("Webhook error", e));
    }
    setLastAnnounced({ name: mech.name, severity: mech.severity, ts: Date.now() });
    setTimeout(() => setLastAnnounced(prev => prev?.ts === Date.now() ? null : prev), 3000);
  };

  useEffect(() => { if (gate) { setSimBar(gate.totalBars); firedRef.current = new Set(); } }, [selectedGateId]);

  useEffect(() => {
    // Check if any mechs should fire at this bar (accounting for lead time)
    if (!gate) return;
    const cfg = getSettings();
    const lead = cfg.lead ?? 10;
    gate.mechanics.forEach(m => {
      if (m.hpBar == null) return;
      const fireAt = m.hpBar + lead; // announce when simBar drops to hpBar + lead
      const key = `${m.id}-${Math.floor(simBar / (m.repeatSecs || 999999))}`;
      if (simBar <= fireAt && simBar > m.hpBar && !firedRef.current.has(key)) {
        firedRef.current.add(key);
        fireAnnouncement(m);
      }
    });
  }, [simBar]);

  useEffect(() => {
    if (playing) timerRef.current = setInterval(() => setSimBar(b => b <= 0 ? (setPlaying(false), 0) : b - 1), 1000 / speed);
    return () => clearInterval(timerRef.current);
  }, [playing, speed]);

  if (!gate) return null;
  const variants = [
    { id:"combined", label:"★ Combined" },
    { id:"compact", label:"Compact List" },
    { id:"hud", label:"HUD Strip" },
    { id:"card", label:"Card Stack" },
    { id:"pill", label:"Minimal Pill" }
  ];
  const gn = `G${gate.gate} · ${gate.raid.toUpperCase()}`;
  const bn = gate.boss.split(",")[0];
  const props = { mechanics: gate.mechanics, currentBar: simBar, totalBars: gate.totalBars, gateName: gn, bossName: bn };
  const OL = { combined: <OLCombined {...props} />, compact: <OLCompact {...props} />, hud: <OLHudStrip {...props} />, card: <OLCardStack {...props} />, pill: <OLPill {...props} /> }[variant];
  const pos = variant === "hud" ? { top: 40, left: "50%", transform: "translateX(-50%)" }
    : variant === "pill" ? { bottom: 110, left: "50%", transform: "translateX(-50%)" }
    : variant === "card" ? { top: 80, right: 30 }
    : variant === "combined" ? { top: 60, left: "50%", transform: "translateX(-50%)" }
    : { top: 70, right: 20 };

  const btn = (active) => ({ background: active ? C.elevated : "transparent", border: "none", borderRadius: 3, padding: "5px 12px", color: active ? C.text : C.textSec, cursor: "pointer", fontSize: 11.5, fontWeight: active ? 600 : 400, transition: "all 0.15s" });

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
      <div style={{ padding: "10px 22px", borderBottom: `1px solid ${C.border}`, background: C.surface, backdropFilter: "blur(8px)", display: "flex", alignItems: "center", gap: 14, flexShrink: 0, flexWrap: "wrap" }}>
        <span style={{ fontSize: 10, color: C.textSec, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.08em" }}>Overlay Style</span>
        <div style={{ display: "flex", gap: 2, background: "#0a0a0a", borderRadius: 5, padding: 2, border: `1px solid ${C.border}` }}>
          {variants.map(v => <button key={v.id} onClick={() => setVariant(v.id)} style={btn(variant === v.id)}>{v.label}</button>)}
        </div>
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <span style={{ fontSize: 10, color: C.textMut, textTransform: "uppercase", letterSpacing: "0.06em", fontWeight: 600 }}>Simulate HP:</span>
          <input type="range" min={0} max={gate.totalBars} value={simBar} onChange={e => { setPlaying(false); setSimBar(parseInt(e.target.value)); }} style={{ width: 160, accentColor: C.accent }} />
          <span style={{ fontSize: 12, fontFamily: "ui-monospace, monospace", color: C.accent, minWidth: 44, fontWeight: 600 }}>{simBar}/{gate.totalBars}</span>
          <select value={speed} onChange={e => setSpeed(parseFloat(e.target.value))} style={{ background: C.elevated, border: `1px solid ${C.border}`, borderRadius: 3, padding: "4px 8px", color: C.text, fontSize: 11, outline: "none" }}>
            <option value={1}>1× sim</option><option value={3}>3× sim</option><option value={8}>8× sim</option>
          </select>
          <button onClick={() => { if (simBar <= 0) { setSimBar(gate.totalBars); firedRef.current = new Set(); } setPlaying(p => !p); }} style={{ background: playing ? "rgba(251,146,60,0.1)" : C.accentDim, border: `1px solid ${playing ? "#fb923c60" : C.accentBorder}`, borderRadius: 3, padding: "5px 14px", color: playing ? "#fb923c" : C.accent, cursor: "pointer", fontSize: 11.5, fontWeight: 700 }}>{playing ? "⏸ PAUSE" : simBar <= 0 ? "↺ RESTART" : "▶ PLAY"}</button>
        </div>
      </div>

      <div style={{ flex: 1, position: "relative", overflow: "hidden", background: `radial-gradient(ellipse at 50% 70%, rgba(40,25,60,0.4) 0%, transparent 60%), linear-gradient(180deg, #050506 0%, #0a0c12 50%, #050406 100%)` }}>
        {/* fake game hud */}
        <div style={{ position: "absolute", top: 14, left: "50%", transform: "translateX(-50%)", width: 340, textAlign: "center" }}>
          <div style={{ fontSize: 10, color: "rgba(255,255,255,0.35)", fontFamily: "Inter, sans-serif", letterSpacing: "0.08em", marginBottom: 4 }}>{gate.boss.toUpperCase()}</div>
          <div style={{ height: 6, borderRadius: 3, background: "rgba(255,255,255,0.08)", overflow: "hidden", border: "1px solid rgba(255,255,255,0.06)" }}>
            <div style={{ height: "100%", width: `${(simBar/gate.totalBars)*100}%`, background: BOSS_HP_COLORS[Math.max(0, Math.ceil(simBar/gate.totalBars * BOSS_HP_COLORS.length) - 1) % BOSS_HP_COLORS.length], transition: "all 0.3s" }} />
          </div>
          <div style={{ fontSize: 9, color: "rgba(255,255,255,0.25)", marginTop: 3, fontFamily: "ui-monospace, monospace" }}>{simBar} / {gate.totalBars} BARS</div>
        </div>
        {/* skill bar */}
        <div style={{ position: "absolute", bottom: 24, left: "50%", transform: "translateX(-50%)", display: "flex", gap: 5 }}>
          {[...Array(8)].map((_, i) => <div key={i} style={{ width: 40, height: 40, borderRadius: 3, background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)" }} />)}
        </div>
        {/* overlay — draggable */}
        {(() => {
          const [dragPos, setDragPos] = React.useState(null);
          const dragRef = React.useRef(null);
          const startDrag = (e) => {
            if (e.button !== 0) return;
            const el = dragRef.current;
            if (!el) return;
            const rect = el.getBoundingClientRect();
            const ox = e.clientX - rect.left, oy = e.clientY - rect.top;
            const onMove = (me) => setDragPos({ x: me.clientX - ox, y: me.clientY - oy });
            const onUp = () => { document.removeEventListener("mousemove", onMove); document.removeEventListener("mouseup", onUp); };
            document.addEventListener("mousemove", onMove);
            document.addEventListener("mouseup", onUp);
          };
          const style = dragPos ? { position: "absolute", left: dragPos.x, top: dragPos.y, cursor: "grab" } : { position: "absolute", ...pos, cursor: "grab" };
          return (
            <div ref={dragRef} style={style} onMouseDown={startDrag} title="Drag to reposition">
              {OL}
              {lastAnnounced && (
                <div style={{ marginTop: 6, background: SEVERITY[lastAnnounced.severity].dim, border: `1px solid ${SEVERITY[lastAnnounced.severity].border}`, borderRadius: 4, padding: "5px 12px", fontSize: 11, color: SEVERITY[lastAnnounced.severity].color, fontWeight: 600, textAlign: "center", animation: "mech-pulse 0.3s ease-out" }}>
                  🔊 Announced: {lastAnnounced.name}
                </div>
              )}
            </div>
          );
        })()}
        {/* hint */}
        <div style={{ position: "absolute", bottom: 80, left: 20, fontSize: 10, color: "rgba(255,255,255,0.18)", letterSpacing: "0.05em" }}>SIMULATED IN-GAME VIEW · USE SLIDER OR ▶ TO TEST</div>
      </div>
    </div>
  );
};

          <div style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 11, color: C.textSec }}>
            <div style={{ width: 8, height: 8, borderRadius: "50%", background: "#4ade80", boxShadow: "0 0 8px #4ade80" }} />
            <span>Lost Ark detected</span>
          </div>
        </div>
      </div>
      <div style={{ flex: 1, display: "flex", overflow: "hidden" }}>
        {tab === "editor" && <EditorView raids={raids} setRaids={persistRaids} selectedGateId={selectedGateId} setSelectedGateId={setSelectedGateId} currentBar={editorSimBar} setCurrentBar={setEditorSimBar} liveGateId={liveGateId} />}
        {tab === "overlay" && <OverlayView raids={raids} selectedGateId={selectedGateId} />}
        {tab === "settings" && <SettingsView />}
      </div>
    </div>
  );
};

window.App = App;


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
